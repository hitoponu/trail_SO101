# 遮蔽のある仮想世界。「地図なしで未知領域へナビゲーションできるか」を検証するための設定。
#
#   ros2 launch lekiwi_base_bringup sim_nav.launch.py \
#     fake_scan_params_file:=$(ros2 pkg prefix lekiwi_base_bringup)/share/lekiwi_base_bringup/config/fake_scan_two_rooms.yaml
#
# ■ なぜ既定の fake_scan.yaml では足りないのか
#   既定は 5x4m の部屋で、A1M8 の測距は 12m ある。つまり初期位置から部屋全体が
#   1 スキャンで見えてしまい、地図は実質 t=0 で完成する。「まだ見ていない場所へ
#   向かう」という肝心の部分を通らない。
#
# ■ この世界の構造 (8m x 6m を仕切り壁で 2 部屋に分ける)
#
#     y=3  ┌──────────────┬───────────────┐
#          │              │               │
#          │              │  (奥の部屋)    │   ← 出入口は x=2, y=1〜3 の 2m
#     y=1  │              └──────┐        │
#          │  ロボット      仕切り壁 │        │
#     y=0  │    ● (0,0)          │        │
#          │                     │   ★    │   ← ゴール (3.5, -2.5)
#     y=-3 └─────────────────────┴────────┘
#         x=-4                  x=2       x=4
#
#   起動位置 (0,0) から見ると、x>2 かつ y<1 の領域は仕切り壁の裏で **完全に見えない**。
#   壁の上端 (2.0, 1.0) を通るレイの角度は atan2(1,2)=26.6° で、それより下向きの
#   レイはすべて壁に当たる。したがってゴール (3.5, -2.5) は起動時点で未知領域にある。
#
#   ロボットは +x/+y へ進んで出入口を見つけ、奥の部屋へ入ってから y を下げる必要がある。
#   経路長は約 7m。
#
# ■ 起動位置が (0,0) である理由
#   base_driver は odom を (0,0,0) で初期化する。world_frame=odom なので、
#   仮想世界は必ず「ロボットの起動位置を原点として」定義すること。
#   障害物を原点に重ねると、ロボットが壁の中から始まって SLAM が破綻する。

/**:
  ros__parameters:
    world_frame: odom

    # 8m x 6m。起動位置 (0,0) は手前の部屋の中央付近。
    room_min_x: -4.0
    room_min_y: -3.0
    room_max_x: 4.0
    room_max_y: 3.0

    # 4 要素ずつ (min_x, min_y, max_x, max_y)
    obstacles:
      # 仕切り壁: x=1.95〜2.05 (厚さ 0.1m)、y=-3.0〜1.0。
      # 南の壁と面一にして、出入口を y=1.0〜3.0 の 2m だけ残す。
      # robot_radius 0.17 + inflation 0.30 でも余裕で通れる幅。
      - 1.95
      - -3.0
      - 2.05
      - 1.0
      # 手前の部屋の箱。特徴が無いとスキャンマッチングが壁沿いに滑るため、
      # 非対称な位置に置いて SLAM が縦横を決められるようにする。
      - -3.0
      - -2.0
      - -2.5
      - -1.5
      # 奥の部屋の箱。奥へ入ってから自己位置を保つための特徴。
      - 3.0
      - 1.5
      - 3.5
      - 2.5

    # ── スキャナ (RPLIDAR A1M8 相当) ────────────────────────────────
    frame_id: laser_link
    scan_topic: scan
    samples: 360
    range_min: 0.15
    range_max: 12.0
    rate_hz: 5.5
    noise_stddev: 0.01
    seed: 0

    # ── odom の系統誤差 ────────────────────────────────────────────
    # launch 引数 odom_trans_scale / odom_yaw_scale で上書きされる。
    odom_trans_scale: 1.0
    odom_yaw_scale: 1.0

    publish_world_markers: true
