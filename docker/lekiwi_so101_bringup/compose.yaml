# LeKiwi ベース + RPLIDAR + SO-101 アーム。map 上の点へリーチする実機用 compose。
#
#   cp .env.example .env   # 先に実機に合わせて編集する
#   docker compose build
#   docker compose up
#
# ■ なぜ 3 コンテナに分けるのか
#   2 つのサブシステムで安全論理が逆だから。
#
#                  正常停止 (SIGINT)        SIGKILL
#     アーム        トルク OFF → 落ちる      保持 → 凍る
#     ベース        停止 → 安全              最後の指令速度で回り続ける
#
#   stop_signal / stop_grace_period はサービス単位にしか設定できないので、
#   1 コンテナにまとめると逆向きの故障モードに 1 つの停止方針を強いることになる。
#   デバイスも 1 対 1 で対応する (/dev/lekiwi, /dev/rplidar, /dev/so101_follower)。
#
# ■ robot_state_publisher と RViz は lekiwi-so101-arm が 1 つだけ持つ
#   3 つの description をすべて $(find) できる唯一のコンテナだから。
#   ベース側は start_robot_state_publisher:=false で起動する
#   (reach.launch.py が nav.launch.py へ渡す)。
#
# ■ 起動前チェック
#   * .env の 3 つのデバイスが実機に合っていること (udev ルール必須)
#   * ★ アームは 7.4V、ホイールは 12V。同一シリアルバスへ繋がないこと
#   * URDF の laser_link 位置と arm_mount 位置が実測値に更新済みであること
#     (TBD の仮値のままだと地図が歪み、その誤差がそのまま手先に乗る)
#
# ■ 停止手順
#   1. docker exec lekiwi-so101-arm /entrypoint.sh \
#        ros2 service call /so101/stow std_srvs/srv/Trigger {}
#   2. アームのコンテナを止める (トルクが切れるので低い姿勢から落とす)
#   3. ベースを止める

services:
  lekiwi-nav:
    build:
      context: ../..
      dockerfile: docker/lekiwi_base_ros2/Dockerfile
    image: local/lekiwi-base-ros2:jazzy
    container_name: lekiwi-nav
    init: true
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-7}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-1}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
    devices:
      - ${LEKIWI_DEVICE:-/dev/lekiwi}:${LEKIWI_DEVICE:-/dev/lekiwi}
    group_add:
      - ${DIALOUT_GID:-20}
    volumes:
      - ${MAP_DIR:-$HOME/maps}:/maps
    # ★ start_robot_state_publisher:=false が要。
    #   結合ロボットの RSP は lekiwi-so101-arm が 1 つだけ持つ。
    #   ここで RSP を上げるとベース単体の URDF が /robot_description に
    #   latch され、RViz にアームの無いロボットが出ることがある。
    command:
      - ros2
      - launch
      - lekiwi_base_bringup
      - nav.launch.py
      - port:=${LEKIWI_DEVICE:-/dev/lekiwi}
      - start_robot_state_publisher:=false
      - start_rviz:=false
      # sllidar_node は rplidar コンテナが担当する
      - start_lidar:=false
    restart: "no"
    stop_signal: SIGINT
    stop_grace_period: 20s
    stdin_open: true
    tty: true

  rplidar:
    build:
      context: ../..
      dockerfile: docker/rplidar_ros2/Dockerfile
      args:
        SLLIDAR_ROS2_REF: ${SLLIDAR_ROS2_REF:-main}
    image: local/rplidar-a1-ros2:jazzy
    container_name: rplidar-a1
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-7}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-1}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
    devices:
      - ${RPLIDAR_DEVICE:-/dev/rplidar}:${RPLIDAR_DEVICE:-/dev/rplidar}
    group_add:
      - ${DIALOUT_GID:-20}
    command:
      - ros2
      - launch
      - rplidar_bringup
      - a1_points.launch.py
      - serial_port:=${RPLIDAR_DEVICE:-/dev/rplidar}
      - start_rviz:=false
    restart: unless-stopped
    stdin_open: true
    tty: true

  lekiwi-so101-arm:
    build:
      context: ../..
      dockerfile: docker/so101_ros2/Dockerfile
    image: local/so101-ros2:jazzy
    container_name: lekiwi-so101-arm
    init: true
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY}
      # Xwayland/X11の認証ファイルを固定パスへマウントする。
      XAUTHORITY: /tmp/.Xauthority
      QT_X11_NO_MITSHM: "1"
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
      XDG_RUNTIME_DIR: /tmp/runtime-root
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-7}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-1}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
      # ★ 手首カメラの取付姿勢。実測したら .env に書く。
      #   結合 URDF の既定値としてここから読まれる。
      WRIST_CAMERA: ${WRIST_CAMERA:-true}
      WRIST_CAMERA_NAME: ${WRIST_CAMERA_NAME:-wrist_camera}
      WRIST_CAMERA_PARENT: ${WRIST_CAMERA_PARENT:-gripper_link}
      WRIST_CAMERA_X: ${WRIST_CAMERA_X:-0.0}
      WRIST_CAMERA_Y: ${WRIST_CAMERA_Y:-0.0}
      WRIST_CAMERA_Z: ${WRIST_CAMERA_Z:-0.0}
      WRIST_CAMERA_ROLL: ${WRIST_CAMERA_ROLL:-0.0}
      WRIST_CAMERA_PITCH: ${WRIST_CAMERA_PITCH:-0.0}
      WRIST_CAMERA_YAW: ${WRIST_CAMERA_YAW:-0.0}
    devices:
      - ${SO101_DEVICE:-/dev/so101_follower}:${SO101_DEVICE:-/dev/so101_follower}
    group_add:
      - ${DIALOUT_GID:-20}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/tmp/.Xauthority}:/tmp/.Xauthority:ro
      # ★ ROS ワークスペースは常にホストからマウントする。
      # イメージにパッケージを焼き込まないので、lekiwi_description も
      # so_arm101_description もここから解決される。
      # 初回とパッケージ追加時は bootstrap.sh を走らせること。
      - ../../ros2_ws:/ros2_ws
      - ../so101_ros2/bootstrap.sh:/bootstrap.sh:ro
      # LeRobot の較正値。実体はサーボの EEPROM で、この JSON はその控え。
      # 較正を実行した PC のホームにしか無い。
      - ${HOME}/.cache/huggingface/lerobot/calibration/robots/so_follower:/root/.cache/huggingface/lerobot/calibration/robots/so_follower:ro
    # ★ 待機するだけ。make reach が起動後に reach.launch.py を exec する。
    #   手動で起動する場合:
    #   docker compose exec -it lekiwi-so101-arm /entrypoint.sh \
    #     ros2 launch lekiwi_so101_bringup reach.launch.py \
    #       backend:=lerobot robot_id:=my_follower
    #
    #   ★ make down は bridge の shutdown service を先に呼び、トルクOFFを待ってから
    #     Composeを停止する。直接 docker compose down する場合はこの保証がない。
    command: ["sleep", "infinity"]
    restart: "no"
    stop_signal: SIGINT
    stop_grace_period: 20s
    stdin_open: true
    tty: true

  # 手首カメラ RealSense D435i。★ アームの gripper_link に載せる。
  #
  # ★ 環境固定カメラと違い、外部キャリブレーションは要らない。
  #   取り付けは結合 URDF が arm_gripper_link -> wrist_camera_mount_link
  #   -> wrist_camera_link を出すので、map -> camera は TF からタダで出る。
  #
  # ★ ROS_DOMAIN_ID をこのスタックに揃えること。docker/realsense_ros2 の
  #   単体構成は既定 0 で、ドメインが違うと RViz が点群を購読できない。
  #
  # ★ コンテナ名は単体スタックの realsense-d435i と別にしてあるが、
  #   **同じ USB デバイスを奪い合う**ので Makefile の guard は両方を見る。
  realsense:
    build:
      context: ../..
      dockerfile: docker/realsense_ros2/Dockerfile
    image: local/realsense-d435i-ros2:jazzy
    container_name: lekiwi-wrist-camera
    init: true
    network_mode: host
    ipc: host
    # RealSense は USB の再接続でノード番号が変わるため devices: 指定が使えない。
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-7}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-1}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
    command:
      - ros2
      - launch
      - realsense_bringup
      - d435i.launch.py
      # ★ camera_name は TF のフレーム名にも効く (wrist_camera_link ...)。
      #   結合 URDF の wrist_camera_name と必ず一致させること。
      - camera_name:=${WRIST_CAMERA_NAME:-wrist_camera}
      - camera_namespace:=${WRIST_CAMERA_NAME:-wrist_camera}
      - enable_pointcloud:=true
      - depth_fps:=${WRIST_CAMERA_FPS:-6}
      - color_fps:=${WRIST_CAMERA_FPS:-6}
      - decimation:=${WRIST_CAMERA_DECIMATION:-2}
      # RViz はアームコンテナが唯一持つ。
      - start_rviz:=false
    # ★ unless-stopped にしないこと。make down 後もデーモン再起動を跨いで
    #   独りで生き残り、make mock したときに模擬光学フレームと衝突する。
    restart: "no"
    stdin_open: true
    tty: true
