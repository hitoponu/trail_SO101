# 保存済み地図 + amcl で動かす compose（環境固定 RealSense を使うならこちら）。
#
#   docker compose -f compose.with_map.yaml up
#
# ■ ★ なぜ SLAM ではなくこちらが要るのか
#   slam_toolbox は**起動位置を原点に毎回新しい map** を作る。
#   環境固定カメラの較正値 (map -> env_camera_link) は特定の map 原点に
#   紐づくので、SLAM モードでは**起動のたびに較正が無効**になる。
#
#   保存地図の yaml は origin: を持つので、同じ yaml を読む限り map は
#   毎回同じ物理フレームになる。だから固定カメラは amcl 構成が前提。
#
# ■ 事前準備
#   1. compose.yaml (SLAM) で地図を作る → make save-map MAP_NAME=my_room
#   2. 床に「ホーム位置」をテープで印す
#   3. .env の MAP_NAME を合わせる
#
# ■ ★ amcl は起動直後は自己位置が未確定
#   RViz の "2D Pose Estimate" で初期姿勢を与えるか、nav2.yaml の amcl に
#   set_initial_pose / initial_pose を設定する。後者のほうが再現性が高く、
#   較正値の劣化も抑えられる。
#
# ■ compose.mock.yaml と同じ理由で**単独ファイル**にしてある
#   Compose は devices: をマージするので、オーバーレイでは差し替えられない。

services:
  lekiwi-nav:
    build:
      context: ../..
      dockerfile: docker/lekiwi_base_ros2/Dockerfile
    image: local/lekiwi-base-ros2:jazzy
    container_name: lekiwi-nav
    init: true
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-7}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-1}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
    devices:
      - ${LEKIWI_DEVICE:-/dev/lekiwi}:${LEKIWI_DEVICE:-/dev/lekiwi}
    group_add:
      - ${DIALOUT_GID:-20}
    volumes:
      - ${MAP_DIR:-$HOME/maps}:/maps
    # ★ start_robot_state_publisher:=false が要。
    #   結合ロボットの RSP は lekiwi-so101-arm が 1 つだけ持つ。
    #   ここで RSP を上げるとベース単体の URDF が /robot_description に
    #   latch され、RViz にアームの無いロボットが出ることがある。
    command:
      - ros2
      - launch
      - lekiwi_base_bringup
      - nav_with_map.launch.py
      # ★ MAP_DIR がコンテナの /maps にマウントされている。
      - map_file:=/maps/${MAP_NAME:-my_room}.yaml
      - port:=${LEKIWI_DEVICE:-/dev/lekiwi}
      - start_robot_state_publisher:=false
      - start_rviz:=false
      - start_lidar:=false
    restart: "no"
    stop_signal: SIGINT
    stop_grace_period: 20s
    stdin_open: true
    tty: true

  rplidar:
    build:
      context: ../..
      dockerfile: docker/rplidar_ros2/Dockerfile
      args:
        SLLIDAR_ROS2_REF: ${SLLIDAR_ROS2_REF:-main}
    image: local/rplidar-a1-ros2:jazzy
    container_name: rplidar-a1
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-7}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-1}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
    devices:
      - ${RPLIDAR_DEVICE:-/dev/rplidar}:${RPLIDAR_DEVICE:-/dev/rplidar}
    group_add:
      - ${DIALOUT_GID:-20}
    command:
      - ros2
      - launch
      - rplidar_bringup
      - a1_points.launch.py
      - serial_port:=${RPLIDAR_DEVICE:-/dev/rplidar}
      - start_rviz:=false
    restart: unless-stopped
    stdin_open: true
    tty: true

  lekiwi-so101-arm:
    build:
      context: ../..
      dockerfile: docker/so101_ros2/Dockerfile
    image: local/so101-ros2:jazzy
    container_name: lekiwi-so101-arm
    init: true
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY}
      QT_X11_NO_MITSHM: "1"
      QT_QPA_PLATFORM: xcb
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
      XDG_RUNTIME_DIR: /tmp/runtime-root
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-7}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-1}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
    devices:
      - ${SO101_DEVICE:-/dev/so101_follower}:${SO101_DEVICE:-/dev/so101_follower}
    group_add:
      - ${DIALOUT_GID:-20}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      # ★ ROS ワークスペースは常にホストからマウントする。
      # イメージにパッケージを焼き込まないので、lekiwi_description も
      # so_arm101_description もここから解決される。
      # 初回とパッケージ追加時は bootstrap.sh を走らせること。
      - ../../ros2_ws:/ros2_ws
      - ../so101_ros2/bootstrap.sh:/bootstrap.sh:ro
      # LeRobot の較正値。実体はサーボの EEPROM で、この JSON はその控え。
      # 較正を実行した PC のホームにしか無い。
      - ${HOME}/.cache/huggingface/lerobot/calibration/robots/so_follower:/root/.cache/huggingface/lerobot/calibration/robots/so_follower:ro
    # ★ 待機するだけ。reach.launch.py は明示的に起動する:
    #   docker compose exec -it lekiwi-so101-arm /entrypoint.sh \
    #     ros2 launch lekiwi_so101_bringup reach.launch.py \
    #       backend:=lerobot robot_id:=my_follower
    #
    #   ★ docker compose down は exec したプロセスに SIGINT を届けないので
    #     トルクは入ったまま残る。落としたいなら launch 側で Ctrl+C すること。
    command: ["sleep", "infinity"]
    restart: "no"
    stop_signal: SIGINT
    stop_grace_period: 20s
    stdin_open: true
    tty: true

  # 環境固定 RealSense D435i。三脚などに据え置き、ロボットには載せない。
  #
  # ★ ROS_DOMAIN_ID をこのスタックに揃えること (docker/realsense_ros2 の単体構成は
  #   既定 0 だが、ドメインが違うと DDS が互いに見えず、RViz は点群を購読できず
  #   較正ノードも map 側とカメラ側の TF を同時に引けない)。
  #
  # ★ ROS_LOCALHOST_ONLY=1 の帰結: このカメラは**ロボットと同じ Linux PC に
  #   挿さっていなければならない**。三脚が離れているなら USB3 アクティブ延長を使う。
  #   別 PC にすると localhost-only を外すことになり、CLAUDE.md が警告する
  #   LAN 混信が復活する。
  #
  # ★ コンテナ名は単体スタックの realsense-d435i と別にしてある。ただし
  #   **同じ USB デバイスを奪い合う**ので、Makefile の guard は両方を見る。
  realsense:
    build:
      context: ../..
      dockerfile: docker/realsense_ros2/Dockerfile
    image: local/realsense-d435i-ros2:jazzy
    container_name: lekiwi-realsense
    init: true
    network_mode: host
    ipc: host
    # RealSense は USB の再接続でノード番号が変わるため devices: 指定が使えない。
    privileged: true
    volumes:
      - /dev/bus/usb:/dev/bus/usb
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-7}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-1}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
    command:
      - ros2
      - launch
      - realsense_bringup
      - d435i.launch.py
      # ★ camera_name は TF のフレーム名にも効く (env_camera_link,
      #   env_camera_depth_optical_frame ...)。env_camera.launch.py と揃えること。
      - camera_name:=${ENV_CAMERA_NAME:-env_camera}
      - camera_namespace:=${ENV_CAMERA_NAME:-env_camera}
      - enable_pointcloud:=true
      # ★ 較正で重力から roll/pitch を出すのに使う。
      - enable_imu:=true
      - depth_fps:=${ENV_CAMERA_FPS:-6}
      - color_fps:=${ENV_CAMERA_FPS:-6}
      - decimation:=${ENV_CAMERA_DECIMATION:-2}
      # RViz はアームコンテナが唯一持つ。
      - start_rviz:=false
    restart: unless-stopped
    stdin_open: true
    tty: true
