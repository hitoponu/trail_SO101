# 実機に一切触れないモック構成。Mac でも動く。
#
#   docker compose -f compose.mock.yaml build
#   docker compose -f compose.mock.yaml up
#
# ■ ★ compose.yaml のオーバーレイではなく「単独ファイル」にしてある
#   Compose は devices: を**マージ**するので、オーバーレイでデバイスを外せない。
#   `!override` (Compose spec 2.24+) を使う手もあるが、実機デバイスを
#   誤って掴む可能性を残さないため単独ファイルにした。
#   較正 JSON の bind mount も無い (mock では不要で、Docker Desktop が
#   存在しないパスを空ディレクトリとして勝手に作ってしまうため)。
#
# ■ 動くもの / 動かないもの
#   動く: 結合 URDF、実ジオメトリの FK/ヤコビアン、ソルバの収束と到達不能判定、
#         ROS グラフ全体、map→…→arm_gripper_frame_link の TF、
#         fake_scan からの slam_toolbox による map→odom、リーチの軌道生成、
#         JTC の実行、JointStateTopicSystem + MockSO101Backend による状態の折り返し
#   動かない: サーボのトルク/PID、実オドメトリの滑り、実スキャン形状、
#             arm_mount の実姿勢と yaw、USB 列挙、12V/7.4V の分離、干渉
#
# ■ RViz は既定で切ってある
#   Apple Silicon の XQuartz + ソフトウェア GL は遅く不安定。
#   形状の確認は tf2_echo と view_frames の PDF で行い、目視確認は Linux 機で。

services:
  lekiwi-nav-mock:
    build:
      context: ../..
      dockerfile: docker/lekiwi_base_ros2/Dockerfile
    image: local/lekiwi-base-ros2:jazzy
    container_name: lekiwi-nav-mock
    init: true
    network_mode: host
    ipc: host
    environment:
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-7}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-1}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
    # devices: 無し。シリアルポートを一切開かない。
    # sim_nav は dry_run のドライバと fake_scan を使うので実機に触れない。
    # ★ start_robot_state_publisher:=false — RSP はアーム側が 1 つだけ持つ。
    command:
      - ros2
      - launch
      - lekiwi_base_bringup
      - sim_nav.launch.py
      - start_robot_state_publisher:=false
      - start_rviz:=false
    restart: "no"
    stop_signal: SIGINT
    stop_grace_period: 20s
    stdin_open: true
    tty: true

  lekiwi-so101-arm-mock:
    build:
      context: ../..
      dockerfile: docker/so101_ros2/Dockerfile
    image: local/so101-ros2:jazzy
    container_name: lekiwi-so101-arm-mock
    init: true
    network_mode: host
    ipc: host
    environment:
      DISPLAY: ${DISPLAY}
      # Xwayland/X11の認証ファイルを固定パスへマウントする。
      XAUTHORITY: /tmp/.Xauthority
      LIBGL_ALWAYS_SOFTWARE: ${LIBGL_ALWAYS_SOFTWARE:-1}
      XDG_RUNTIME_DIR: /tmp/runtime-root
      ROS_DOMAIN_ID: ${ROS_DOMAIN_ID:-7}
      ROS_LOCALHOST_ONLY: ${ROS_LOCALHOST_ONLY:-1}
      ROS_AUTOMATIC_DISCOVERY_RANGE: ${ROS_AUTOMATIC_DISCOVERY_RANGE:-LOCALHOST}
      # ★ 手首カメラの取付姿勢。実測したら .env に書く。
      #   結合 URDF の既定値としてここから読まれる。
      #   ★★ 既定値は実測値ではなく、公式 STL からの幾何計算値
      #      (D405 + Wrist_Roll_D405_Holder 前提)。docs/wrist_camera.md 参照。
      WRIST_CAMERA: ${WRIST_CAMERA:-true}
      WRIST_CAMERA_NAME: ${WRIST_CAMERA_NAME:-wrist_camera}
      WRIST_CAMERA_PARENT: ${WRIST_CAMERA_PARENT:-gripper_link}
      WRIST_CAMERA_X: ${WRIST_CAMERA_X:-0.0}
      WRIST_CAMERA_Y: ${WRIST_CAMERA_Y:--0.07112}
      WRIST_CAMERA_Z: ${WRIST_CAMERA_Z:--0.02074}
      WRIST_CAMERA_ROLL: ${WRIST_CAMERA_ROLL:-3.14159}
      WRIST_CAMERA_PITCH: ${WRIST_CAMERA_PITCH:-1.04718}
      WRIST_CAMERA_YAW: ${WRIST_CAMERA_YAW:-1.57080}
    volumes:
      - /tmp/.X11-unix:/tmp/.X11-unix:rw
      - ${XAUTHORITY:-/tmp/.Xauthority}:/tmp/.Xauthority:ro
      # ★ ROS ワークスペースは常にホストからマウントする。
      # イメージにパッケージを焼き込まないので、lekiwi_description も
      # so_arm101_description もここから解決される。
      # 初回とパッケージ追加時は bootstrap.sh を走らせること。
      - ../../ros2_ws:/ros2_ws
      - ../so101_ros2/bootstrap.sh:/bootstrap.sh:ro
    # backend:=mock でアーム側はシリアルを開かない。
    command:
      - ros2
      - launch
      - lekiwi_so101_bringup
      - reach.launch.py
      - backend:=mock
      - start_rviz:=${MOCK_START_RVIZ:-false}
      # ★ カメラ実機なしで光学フレームを模し、map -> 光学フレームの疎通と
      #   軸の向きを Mac で検証する。実機では realsense が出すので false。
      - mock_wrist_camera_optical:=true
    restart: "no"
    stop_signal: SIGINT
    stop_grace_period: 20s
    stdin_open: true
    tty: true
